[tool.poetry]
package-mode = false

[project]
name = "portfolio-opt"
version = "1.0.0"
description = "Portfolio optimization engine with Mean-Variance and Minimal Variance strategies"
authors = [
    {name = "David Castillo", email = "dcastilloa@uni.pe"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "cvxopt",
    "requests",
    "tqdm",
    "fastapi",
    "uvicorn",
    "python-multipart (>=0.0.28,<0.0.29)",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
opt = "python main.py"
web = "uvicorn web.main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest tests/ -v"
